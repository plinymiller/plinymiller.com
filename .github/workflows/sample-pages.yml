name: Sample pages stay encrypted

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ciphertext:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gated Kinville HTML is ciphertext
        run: |
          set -euo pipefail
          mapfile -t files < <(find samples/kinville -name '*.html' | sort)
          test "${#files[@]}" -ge 7
          for f in "${files[@]}"; do
            grep -q 'staticryptEncryptedMsgUniqueVariableName' "$f"
            grep -q '"rememberDurationInDays":30' "$f"
            grep -q 'id="staticrypt-username"' "$f"
            grep -q 'id="staticrypt-password"' "$f"
            grep -q 'Remember me for 30 days' "$f"
            if grep -q 'class="hero-mark"' "$f"; then
              echo "plaintext page found in $f" >&2
              exit 1
            fi
            if grep -q 'id="content"' "$f"; then
              echo "plaintext page found in $f" >&2
              exit 1
            fi
          done
          grep -q 'class="samples-dot" href="samples/"' index.html
          grep -q 'tabindex="-1"' index.html
          grep -q 'aria-hidden="true"' index.html
          if grep -q '>Samples<' index.html; then
            echo "visible Samples link still on the homepage" >&2
            exit 1
          fi
          if grep -q 'samples/' portfolio/index.html; then
            echo "samples link still on the portfolio page" >&2
            exit 1
          fi
          grep -q 'href="kinville/"' samples/index.html
          grep -q 'href="tuff-sledding/"' samples/index.html
          test ! -e samples/_src
          mapfile -t tuff < <(find samples/tuff-sledding -name '*.html' | sort)
          test "${#tuff[@]}" -ge 11
          for f in "${tuff[@]}"; do
            grep -q 'staticryptEncryptedMsgUniqueVariableName' "$f"
            grep -q '"rememberDurationInDays":30' "$f"
            grep -q 'id="staticrypt-username"' "$f"
            grep -q 'id="staticrypt-password"' "$f"
            grep -q 'Remember me for 30 days' "$f"
            if grep -q 'class="draft-banner"' "$f"; then
              echo "plaintext page found in $f" >&2
              exit 1
            fi
            if grep -q 'class="wordmark"' "$f"; then
              echo "plaintext page found in $f" >&2
              exit 1
            fi
          done
          test ! -e samples/tuff-sledding/README.txt
